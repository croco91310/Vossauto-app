<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101421"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>REM — Journal de rêves</title><style>:root{--bg:#0d1019;--card:#171b29;--line:#292f43;--txt:#f3f0ea;--muted:#9da4b7;--glow:#c7b9ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#30284d 0,#151827 32%,#0d1019 65%);color:var(--txt);font-family:Georgia,'Times New Roman',serif}body{padding-bottom:30px}.app{max-width:720px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px 30px}.top{display:flex;justify-content:space-between;align-items:center;font-family:-apple-system,sans-serif}.logo{letter-spacing:.28em;font-weight:800}.moon{font-size:21px}.hero{text-align:center;padding:58px 8px 28px}.hero small{font-family:-apple-system,sans-serif;color:#aaa4c8;letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:42px;font-weight:500;margin:13px 0 10px}.hero p{color:var(--muted);font-family:-apple-system,sans-serif;line-height:1.5;margin:auto;max-width:480px}.recordWrap{height:230px;display:grid;place-items:center}.record{width:154px;height:154px;border-radius:50%;border:1px solid #bcaeff55;background:radial-gradient(circle at 35% 30%,#f2ecff,#b7a4ef 25%,#695b9a 60%,#28243d 100%);box-shadow:0 0 45px #b8a6ff55,0 0 120px #7563aa44;color:#282136;font-size:40px}.record.on{animation:p 1.2s infinite}@keyframes p{50%{transform:scale(1.08);box-shadow:0 0 65px #d4c8ff88,0 0 150px #8e7bc055}}.status{text-align:center;font-family:-apple-system,sans-serif;font-weight:700}.hint{text-align:center;color:var(--muted);font-family:-apple-system,sans-serif;font-size:12px;margin-top:6px}.tabs{display:flex;gap:8px;margin:28px 0 12px;font-family:-apple-system,sans-serif}.tab{flex:1;border:1px solid var(--line);background:#151927;color:#9ea5b8;border-radius:14px;padding:11px}.tab.active{background:#ece8f8;color:#292538}.panel{display:none}.panel.active{display:block}.dream{background:linear-gradient(145deg,#191d2c,#121621);border:1px solid var(--line);border-radius:22px;padding:17px;margin:10px 0}.date{font-family:-apple-system,sans-serif;color:#9ea5b8;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.dream h2{font-size:22px;font-weight:500;margin:7px 0}.dream p{font-family:-apple-system,sans-serif;color:#c4c9d5;line-height:1.5;margin:0}.tags{margin-top:12px}.tag{display:inline-block;font-family:-apple-system,sans-serif;font-size:10px;background:#252a3d;color:#cfc8e9;padding:6px 8px;border-radius:99px;margin:2px}.empty{border:1px dashed #32384d;border-radius:20px;text-align:center;padding:28px;color:#9299aa;font-family:-apple-system,sans-serif}.search{width:100%;background:#151927;border:1px solid var(--line);border-radius:15px;color:white;padding:13px;font-family:-apple-system,sans-serif;margin-bottom:10px}.fragment{background:#151927;border-left:3px solid #a999d9;border-radius:12px;padding:13px;margin:9px 0;font-family:-apple-system,sans-serif;color:#ccd0da}.note{font-family:-apple-system,sans-serif;color:#7f879a;font-size:11px;text-align:center;margin-top:18px}</style></head><body><div class="app"><div class="top"><div class="logo">REM</div><div class="moon">☾</div></div><div class="hero"><small>Journal de rêves</small><h1>Tu te souviens ?</h1><p>Raconte avant que ça disparaisse. Quelques mots suffisent.</p></div><div class="recordWrap"><button class="record" id="record" onclick="listen()">◉</button></div><div class="status" id="status">Raconter mon rêve</div><div class="hint">Appuie et parle naturellement</div><div class="tabs"><button class="tab active" onclick="show('journal',this)">Souvenirs</button><button class="tab" onclick="show('fragments',this)">Fragments</button><button class="tab" onclick="show('search',this)">Retrouver</button></div><div id="journal" class="panel active"><div id="dreams"></div></div><div id="fragments" class="panel"><div id="frags"></div></div><div id="search" class="panel"><input class="search" id="q" placeholder="Forêt, maison, pluie, quelqu’un…" oninput="renderSearch()"><div id="results"></div></div><div class="note">Les souvenirs sont enregistrés uniquement sur cet appareil dans cette première version.</div></div><script>const K='remDreams',F='remFragments';const SR=window.SpeechRecognition||window.webkitSpeechRecognition;function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function show(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active')}function listen(){if(!SR){alert('La reconnaissance vocale n’est pas disponible ici. Ouvre REM dans Safari.');return}let r=new SR();r.lang='fr-FR';r.continuous=false;r.interimResults=true;r.onstart=()=>{record.classList.add('on');status.textContent='Je t’écoute…'};r.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;if(e.results[e.results.length-1].isFinal)saveMemory(t.trim());else status.textContent=t};r.onend=()=>{record.classList.remove('on');status.textContent='Raconter mon rêve'};r.start()}function saveMemory(t){if(!t)return;let words=t.split(/\s+/);if(words.length<7){let a=JSON.parse(localStorage.getItem(F)||'[]');a.unshift({text:t,date:new Date().toLocaleString('fr-FR')});localStorage.setItem(F,JSON.stringify(a));render();return}let title=makeTitle(t),tags=makeTags(t);let a=JSON.parse(localStorage.getItem(K)||'[]');a.unshift({id:Date.now(),text:t,title,date:new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}),tags});localStorage.setItem(K,JSON.stringify(a));render()}function makeTitle(t){let s=t.toLowerCase();if(s.includes('maison'))return 'La maison';if(s.includes('forêt')||s.includes('foret'))return 'Dans la forêt';if(s.includes('mer')||s.includes('plage'))return 'Au bord de l’eau';if(s.includes('voiture'))return 'La route';if(s.includes('voler')||s.includes('volais'))return 'Dans les airs';return 'Un rêve presque oublié'}function makeTags(t){let pool=['maison','forêt','foret','voiture','pluie','nuit','mer','plage','famille','enfant','chien','peur','école','ecole','route','avion','travail'];let s=t.toLowerCase();return pool.filter(x=>s.includes(x)).map(x=>x==='foret'?'forêt':x).slice(0,5)}function card(d){return `<div class="dream"><div class="date">${esc(d.date)}</div><h2>${esc(d.title)}</h2><p>${esc(d.text)}</p><div class="tags">${d.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div>`}function render(){let a=JSON.parse(localStorage.getItem(K)||'[]'),f=JSON.parse(localStorage.getItem(F)||'[]');dreams.innerHTML=a.length?a.map(card).join(''):'<div class="empty">Ton premier rêve apparaîtra ici.<br>Au réveil, raconte-le avant de bouger.</div>';frags.innerHTML=f.length?f.map(x=>`<div class="fragment"><div class="date">${esc(x.date)}</div>${esc(x.text)}</div>`).join(''):'<div class="empty">Un fragment peut être trois mots seulement.<br>« tunnel · pluie · maison rouge »</div>';renderSearch()}function renderSearch(){let a=JSON.parse(localStorage.getItem(K)||'[]'),s=(q?.value||'').toLowerCase().trim();results.innerHTML=s?a.filter(d=>(d.text+' '+d.title+' '+d.tags.join(' ')).toLowerCase().includes(s)).map(card).join('')||'<div class="empty">Aucun souvenir retrouvé.</div>':'<div class="empty">Recherche dans tes rêves par lieu, personne, objet ou sensation.</div>'}render();</script></body></html>
