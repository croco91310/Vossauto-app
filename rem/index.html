<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101421"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>REM — Journal de rêves</title><style>:root{--line:#292f43;--txt:#f3f0ea;--muted:#9da4b7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#30284d 0,#151827 32%,#0d1019 65%);color:var(--txt);font-family:Georgia,serif}.app{max-width:720px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px 35px}.top{display:flex;justify-content:space-between;font-family:-apple-system,sans-serif}.logo{letter-spacing:.28em;font-weight:800}.hero{text-align:center;padding:44px 8px 18px}.hero small{font-family:-apple-system,sans-serif;color:#aaa4c8;letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:42px;font-weight:500;margin:12px 0 8px}.hero p{color:var(--muted);font-family:-apple-system,sans-serif}.capture{background:#121624aa;border:1px solid var(--line);border-radius:26px;padding:16px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.mode{border:1px solid var(--line);border-radius:14px;padding:11px;background:#181c2b;color:#b5bbca;font-family:-apple-system,sans-serif}.mode.active{background:#eee9f7;color:#282438}.voice{text-align:center}.record{width:122px;height:122px;border-radius:50%;border:1px solid #bcaeff55;background:radial-gradient(circle at 35% 30%,#f2ecff,#b7a4ef 25%,#695b9a 60%,#28243d);box-shadow:0 0 45px #b8a6ff55;color:#282136;font-size:34px;margin:16px}.record.on{animation:p 1.1s infinite}@keyframes p{50%{transform:scale(1.08)}}.status{font-family:-apple-system,sans-serif;font-weight:700}.hint{font-family:-apple-system,sans-serif;font-size:11px;color:var(--muted);margin-top:4px}.write{display:none}.write.active{display:block}.voice.hide{display:none}textarea{width:100%;min-height:125px;background:#0e121d;border:1px solid #2d3448;border-radius:17px;color:white;padding:14px;font:16px -apple-system,sans-serif;resize:none}.save{width:100%;border:0;border-radius:14px;padding:13px;background:#e9e4f5;color:#292438;font-weight:800;margin-top:8px}.tabs{display:flex;gap:7px;margin:24px 0 12px;font-family:-apple-system,sans-serif}.tab{flex:1;border:1px solid var(--line);background:#151927;color:#9ea5b8;border-radius:13px;padding:10px 5px}.tab.active{background:#ece8f8;color:#292538}.panel{display:none}.panel.active{display:block}.dream{background:linear-gradient(145deg,#191d2c,#121621);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0}.date{font:11px -apple-system,sans-serif;color:#9ea5b8;text-transform:uppercase}.dream h2{font-size:21px;font-weight:500;margin:7px 0}.dream p{font:14px -apple-system,sans-serif;color:#c4c9d5;line-height:1.5;margin:0}.tag{display:inline-block;font:10px -apple-system,sans-serif;background:#252a3d;color:#cfc8e9;padding:6px 8px;border-radius:99px;margin:8px 2px 0}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:180px;border-radius:20px;padding:15px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;border:1px solid #34394c;background:radial-gradient(circle at 70% 15%,#74658f,#302d48 35%,#171a28 75%);position:relative}.tile:nth-child(3n+2){background:radial-gradient(circle at 20% 15%,#716f8f,#31374c 38%,#171a28 75%)}.tile:nth-child(3n){background:radial-gradient(circle at 60% 15%,#836c7b,#45323f 38%,#181925 75%)}.tile:before{content:'☾';position:absolute;top:18px;right:18px;font-size:38px;color:#ffffff30}.tile b{font-size:19px;font-weight:500;z-index:1}.tile span{font:10px -apple-system,sans-serif;color:#c2c5d1;margin-top:4px;z-index:1}.empty{border:1px dashed #32384d;border-radius:20px;text-align:center;padding:28px;color:#9299aa;font-family:-apple-system,sans-serif}.search{width:100%;background:#151927;border:1px solid var(--line);border-radius:15px;color:white;padding:13px;font-family:-apple-system,sans-serif}.fragment{background:#151927;border-left:3px solid #a999d9;border-radius:12px;padding:13px;margin:9px 0;font-family:-apple-system,sans-serif;color:#ccd0da}.note{font:11px -apple-system,sans-serif;color:#7f879a;text-align:center;margin-top:18px}</style></head><body><div class="app"><div class="top"><div class="logo">REM</div><div>☾</div></div><div class="hero"><small>Journal de rêves</small><h1>Tu te souviens ?</h1><p>Attrape le rêve avant qu'il disparaisse.</p></div><div class="capture"><div class="modes"><button id="voiceBtn" class="mode active" onclick="captureMode('voice')">🎙 Raconter</button><button id="writeBtn" class="mode" onclick="captureMode('write')">✎ Écrire</button></div><div id="voice" class="voice"><button class="record" id="record" onclick="listen()">◉</button><div class="status" id="status">Raconter mon rêve</div><div class="hint">Quand tu peux parler sans réveiller tout le monde 😴</div></div><div id="write" class="write"><textarea id="dreamText" placeholder="J'étais dans une maison… il faisait nuit…"></textarea><button class="save" onclick="saveWritten()">Garder ce souvenir</button><div class="hint">Même trois mots suffisent. Tu pourras t'en souvenir plus tard.</div></div></div><div class="tabs"><button class="tab active" onclick="show('journal',this)">Journal</button><button class="tab" onclick="show('galleryPanel',this)">Galerie</button><button class="tab" onclick="show('fragments',this)">Fragments</button><button class="tab" onclick="show('search',this)">Chercher</button></div><div id="journal" class="panel active"><div id="dreams"></div></div><div id="galleryPanel" class="panel"><div id="gallery" class="gallery"></div></div><div id="fragments" class="panel"><div id="frags"></div></div><div id="search" class="panel"><input class="search" id="q" placeholder="Maison, forêt, quelqu'un…" oninput="renderSearch()"><div id="results"></div></div><div class="note">REM V2 · souvenirs conservés sur cet appareil</div></div><script>const K='remDreams',F='remFragments',SR=window.SpeechRecognition||window.webkitSpeechRecognition;function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function captureMode(m){voice.classList.toggle('hide',m!=='voice');write.classList.toggle('active',m==='write');voiceBtn.classList.toggle('active',m==='voice');writeBtn.classList.toggle('active',m==='write');if(m==='write')dreamText.focus()}function show(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active')}function listen(){if(!SR){alert('La reconnaissance vocale n’est pas disponible ici. Utilise le mode Écrire.');return}let r=new SR();r.lang='fr-FR';r.interimResults=true;r.onstart=()=>{record.classList.add('on');status.textContent='Je t’écoute…'};r.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;if(e.results[e.results.length-1].isFinal)saveMemory(t.trim());else status.textContent=t};r.onend=()=>{record.classList.remove('on');status.textContent='Raconter mon rêve'};r.start()}function saveWritten(){let t=dreamText.value.trim();if(!t)return;saveMemory(t);dreamText.value=''}function saveMemory(t){if(!t)return;let words=t.split(/\s+/);if(words.length<7){let a=JSON.parse(localStorage.getItem(F)||'[]');a.unshift({text:t,date:new Date().toLocaleString('fr-FR')});localStorage.setItem(F,JSON.stringify(a));render();return}let a=JSON.parse(localStorage.getItem(K)||'[]');a.unshift({id:Date.now(),text:t,title:makeTitle(t),date:new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}),tags:makeTags(t)});localStorage.setItem(K,JSON.stringify(a));render()}function makeTitle(t){let s=t.toLowerCase();if(s.includes('maison'))return 'La maison';if(s.includes('forêt')||s.includes('foret'))return 'Dans la forêt';if(s.includes('mer')||s.includes('plage'))return 'Au bord de l’eau';if(s.includes('voiture'))return 'La route';if(s.includes('voler')||s.includes('volais'))return 'Dans les airs';return 'Un rêve presque oublié'}function makeTags(t){let pool=['maison','forêt','foret','voiture','pluie','nuit','mer','plage','famille','enfant','chien','peur','école','ecole','route','avion','travail'];let s=t.toLowerCase();return [...new Set(pool.filter(x=>s.includes(x)).map(x=>x==='foret'?'forêt':x))].slice(0,5)}function card(d){return `<div class="dream"><div class="date">${esc(d.date)}</div><h2>${esc(d.title)}</h2><p>${esc(d.text)}</p>${d.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`}function render(){let a=JSON.parse(localStorage.getItem(K)||'[]'),f=JSON.parse(localStorage.getItem(F)||'[]');dreams.innerHTML=a.length?a.map(card).join(''):'<div class="empty">Ton premier rêve apparaîtra ici.</div>';gallery.innerHTML=a.length?a.map(d=>`<div class="tile"><b>${esc(d.title)}</b><span>${esc(d.date)}</span></div>`).join(''):'<div class="empty" style="grid-column:1/-1">La galerie se remplira avec tes rêves.<br>Plus tard, chaque carte aura son image générée par IA.</div>';frags.innerHTML=f.length?f.map(x=>`<div class="fragment"><div class="date">${esc(x.date)}</div>${esc(x.text)}</div>`).join(''):'<div class="empty">« tunnel · pluie · maison rouge »<br>Trois mots peuvent sauver un rêve.</div>';renderSearch()}function renderSearch(){let a=JSON.parse(localStorage.getItem(K)||'[]'),s=(q?.value||'').toLowerCase().trim();results.innerHTML=s?a.filter(d=>(d.text+' '+d.title+' '+d.tags.join(' ')).toLowerCase().includes(s)).map(card).join('')||'<div class="empty">Aucun souvenir retrouvé.</div>':'<div class="empty">Recherche par lieu, personne, objet ou sensation.</div>'}render();</script></body></html>
